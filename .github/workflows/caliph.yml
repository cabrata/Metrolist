name: Build Caliph APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
      - "fastlane/**"
      - "assets/**"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Build FOSS release APK
        run: bash gradlew --console=plain assembleFossRelease -x lint -x lintFossRelease
        env:
          METROLIST_APPLICATION_ID: com.caliph.metrolist
          METROLIST_APP_NAME: Metrolist
          METROLIST_BUILD_COMMIT: ${{ github.sha }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Sign APK
        id: sign
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/foss/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 36.0.0

      - name: Rename APK
        run: |
          mkdir -p out
          mv "${{ steps.sign.outputs.signedFile }}" out/Metrolist-caliph-${GITHUB_SHA::7}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Metrolist-caliph
          path: out/*.apk

      # Every main push refreshes the rolling "nightly" release, tags get their own release.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            gh release create "$TAG" out/*.apk --title "Metrolist $TAG" --generate-notes
          else
            TAG=nightly
            gh release delete "$TAG" --yes --cleanup-tag || true
            gh release create "$TAG" out/*.apk --prerelease --target "$GITHUB_SHA" \
              --title "Metrolist nightly (${GITHUB_SHA::7})" \
              --notes "Automatic build of ${GITHUB_SHA} (package com.caliph.metrolist)."
          fi
